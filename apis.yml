aid: heltia
name: Heltia
description: 'Heltia is a Turkish digital mental-health and employee-wellbeing platform
  (an Employee Assistance Platform, EAP) that connects individuals and corporate employees
  with licensed psychologists and dietitians for online therapy, counseling and nutrition
  support. Its consumer app offers video sessions with experts, self-assessment tests
  (anxiety, depression, OCD, motivation) and an expert-reviewed blog, while its corporate
  products — Esenlik (wellbeing), Sağlık Yönetimi (health management) and brokerage —
  give employers measurable workforce mental-health programs. Backed by Northzone.
  Heltia does not currently publish a public developer API, SDK or documentation surface.'
